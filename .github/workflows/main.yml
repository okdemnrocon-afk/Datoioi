name: SUN GAME

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: sun-game
  cancel-in-progress: true

jobs:
  run-sun:
    runs-on: ubuntu-latest

    steps:

      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v4

      # =========================
      # PYTHON
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # =========================
      # INSTALL
      # =========================
      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip

          pip install requests
          pip install websocket-client
          pip install websockets
          pip install msgpack
          pip install colorama
          pip install pycryptodome

          echo "=============================="
          echo "Python version:"
          python --version
          echo "=============================="

      # =========================
      # DECODE SUN_GAMEOK
      # =========================
      - name: Decode SUN_GAMEOK
        env:
          SUN_GAMEOK: ${{ secrets.SUN_GAMEOK }}
        run: |
          if [ -z "$SUN_GAMEOK" ]; then
            echo "❌ SUN_GAMEOK chưa được cấu hình!"
            exit 1
          fi

          printf '%s' "$SUN_GAMEOK" | base64 -d > sun.py

          if [ ! -s sun.py ]; then
            echo "❌ sun.py rỗng!"
            exit 1
          fi

          echo "✅ Đã giải mã sun.py"
          wc -c sun.py

      # =========================
      # CHECK SYNTAX
      # =========================
      - name: Check Python syntax
        run: |
          python -m py_compile sun.py
          echo "✅ Syntax OK"

      # =========================
      # RUN SUN
      # =========================
      - name: Run SUN
        run: |
          START=$(date +%s)

          echo "================================"
          echo "🚀 SUN START"
          echo "⏰ $(date)"
          echo "================================"

          set +e

          timeout --signal=SIGTERM 5h30m python -u sun.py

          CODE=$?

          set -e

          END=$(date +%s)
          RUNTIME=$((END - START))

          echo "================================"
          echo "🔴 SUN STOPPED"
          echo "Exit code: $CODE"
          echo "Runtime: ${RUNTIME}s"
          echo "================================"

          if [ "$RUNTIME" -lt 300 ]; then
            echo "⚠️ SUN DIE SỚM"
            echo "⏳ Chờ 30 giây..."
            sleep 30
          else
            echo "♻️ SUN chạy đủ lâu"
          fi

      # =========================
      # RESTART
      # =========================
      - name: Restart SUN
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "================================"
          echo "♻️ RESTART WORKFLOW"
          echo "================================"

          gh workflow run "${{ github.workflow }}" \
            --ref "${{ github.ref_name }}"

          echo "✅ Đã yêu cầu chạy lại"
