name: SUN GAME

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: sun-game
  cancel-in-progress: true

jobs:
  run-sun:
    runs-on: ubuntu-latest

    steps:
      # ==============================
      # CHECKOUT
      # ==============================
      - name: Checkout
        uses: actions/checkout@v4

      # ==============================
      # PYTHON
      # ==============================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # ==============================
      # INSTALL LIBRARIES
      # ==============================
      - name: Install Python libraries
        run: |
          python -m pip install --upgrade pip

          pip install requests
          pip install websocket-client
          pip install websockets
          pip install msgpack
          pip install colorama
          pip install pycryptodome

          echo "================================"
          echo "Python:"
          python --version

          echo "================================"
          echo "Installed packages:"
          pip list

      # ==============================
      # DECODE SUN_GAMEOK
      # ==============================
      - name: Decode SUN_GAMEOK
        env:
          SUN_GAMEOK: ${{ secrets.SUN_GAMEOK }}
        run: |
          if [ -z "$SUN_GAMEOK" ]; then
            echo "❌ SUN_GAMEOK chưa được cấu hình!"
            exit 1
          fi

          printf '%s' "$SUN_GAMEOK" | base64 -d > sun.py

          if [ ! -s sun.py ]; then
            echo "❌ sun.py rỗng!"
            exit 1
          fi

          echo "✅ Decode sun.py thành công"

          echo "Kích thước:"
          wc -c sun.py

      # ==============================
      # CHECK PYTHON SYNTAX
      # ==============================
      - name: Check Python syntax
        run: |
          python -m py_compile sun.py
          echo "✅ Python syntax OK"

      # ==============================
      # RUN SUN
      # ==============================
      - name: Run SUN
        id: run_sun
        run: |
          START=$(date +%s)

          echo "======================================"
          echo "🚀 START SUN"
          echo "⏰ Start: $(date)"
          echo "======================================"

          set +e

          timeout --signal=SIGTERM 5h30m \
            python -u sun.py

          CODE=$?

          set -e

          END=$(date +%s)

          RUNTIME=$((END - START))

          echo "======================================"
          echo "🔴 SUN STOPPED"
          echo "Exit code: $CODE"
          echo "Runtime: ${RUNTIME}s"
          echo "End: $(date)"
          echo "======================================"

          echo "exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "runtime=$RUNTIME" >> "$GITHUB_OUTPUT"

          # Nếu chạy dưới 5 phút => coi là crash/die sớm
          if [ "$RUNTIME" -lt 300 ]; then
            echo "early=true" >> "$GITHUB_OUTPUT"

            echo "⚠️ SUN DIE SỚM"
            echo "⏳ Chờ 30 giây rồi restart..."

            sleep 30
          else
            echo "early=false" >> "$GITHUB_OUTPUT"

            echo "♻️ SUN đã chạy đủ lâu"
            echo "⏳ Chuẩn bị restart..."
          fi

      # ==============================
      # RESTART WORKFLOW
      # ==============================
      - name: Restart SUN
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "======================================"
          echo "♻️ START NEW GITHUB ACTION"
          echo "======================================"

          gh workflow run "${{ github.workflow }}" \
            --ref "${{ github.ref_name }}"

          echo "✅ Đã yêu cầu workflow mới"
