name: SUN GAME 24/7

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest

    # Không để job chạy quá lâu; trước khi hết thời gian
    # workflow sẽ kích hoạt run mới.
    timeout-minutes: 340

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets
          pip install requests
          pip install websocket-client
          pip install msgpack
          pip install colorama
          pip install pycryptodome

      - name: Decode SUN_GAMEOK
        env:
          SUN_GAMEOK: ${{ secrets.SUN_GAMEOK }}
        run: |
          if [ -z "$SUN_GAMEOK" ]; then
            echo "SUN_GAMEOK chưa được cấu hình!"
            exit 1
          fi

          echo "$SUN_GAMEOK" | base64 --decode > main.py

          if [ ! -s main.py ]; then
            echo "Decode SUN_GAMEOK thất bại!"
            exit 1
          fi

          chmod 600 main.py

          echo "Decode thành công."

      - name: Run bot with auto restart
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          END_TIME=$(($(date +%s) + 19800))

          while true; do

            NOW=$(date +%s)

            if [ "$NOW" -ge "$END_TIME" ]; then
              echo "Workflow sắp kết thúc."
              break
            fi

            echo "========================================"
            echo "Starting SUN GAME..."
            echo "Time: $(date)"
            echo "========================================"

            python main.py

            EXIT_CODE=$?

            echo "========================================"
            echo "Bot stopped."
            echo "Exit code: $EXIT_CODE"
            echo "Restart sau 5 giây..."
            echo "========================================"

            sleep 5
          done

      - name: Start next workflow
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Starting next workflow..."

          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/sun-game.yml/dispatches" \
            -d '{"ref":"main"}'

          echo "Next workflow requested."
